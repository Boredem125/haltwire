<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripwire — Architecture</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{font-size:2rem;font-weight:700;margin-bottom:4px;color:#e6edf3}
.subtitle{font-size:1rem;color:#8b949e;margin-bottom:40px}
.diagram{width:100%;max-width:1100px}
svg{width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:32px;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.85rem;color:#8b949e}
.legend-dot{width:14px;height:14px;border-radius:3px}
.flow-label{font-size:.7rem;fill:#8b949e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.comp-label{font-size:.78rem;fill:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:600}
.comp-sub{font-size:.65rem;fill:#8b949e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.zone-label{font-size:.72rem;fill:#484f58;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
</style>
</head>
<body>

<h1>Tripwire — Component Architecture</h1>
<p class="subtitle">Team Timepass · Google Startup Buildathon 2026</p>

<div class="diagram">
<svg viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg">

  <!-- ============ ZONES ============ -->
  <!-- Browser zone -->
  <rect x="30" y="20" width="300" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="45" y="42" class="zone-label">Browser (Judge UI)</text>

  <!-- GCP VM zone -->
  <rect x="30" y="160" width="1040" height="540" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="45" y="185" class="zone-label">GCP Compute Engine VM</text>

  <!-- Caddy sub-zone -->
  <rect x="50" y="200" width="180" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="62" y="222" class="zone-label">Caddy</text>

  <!-- FastAPI sub-zone -->
  <rect x="50" y="290" width="1000" height="395" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="65" y="312" class="zone-label">FastAPI Server (arena/)</text>

  <!-- ============ COMPONENTS ============ -->

  <!-- Browser: Scenario Picker + Log -->
  <rect x="50" y="55" width="130" height="58" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="115" y="78" text-anchor="middle" class="comp-label">Scenario Picker</text>
  <text x="115" y="96" text-anchor="middle" class="comp-sub">+ Live Event Log</text>

  <!-- Browser: Mic/Speaker -->
  <rect x="195" y="55" width="120" height="58" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="255" y="78" text-anchor="middle" class="comp-label">Mic / Speaker</text>
  <text x="255" y="96" text-anchor="middle" class="comp-sub">PCM 16 kHz</text>

  <!-- Caddy box -->
  <rect x="65" y="230" width="150" height="30" rx="6" fill="#1a2332" stroke="#2d4a7a" stroke-width="1"/>
  <text x="140" y="250" text-anchor="middle" class="comp-label">:443 / :80 → reverse_proxy</text>

  <!-- AGENT -->
  <rect x="70" y="335" width="175" height="65" rx="8" fill="#4a148c" stroke="#7c43bd" stroke-width="1.5"/>
  <text x="157" y="360" text-anchor="middle" class="comp-label">Gemini Flash</text>
  <text x="157" y="377" text-anchor="middle" class="comp-sub">Agent Loop (agent.py)</text>
  <text x="157" y="392" text-anchor="middle" class="comp-sub">read · write · list · run</text>

  <!-- TRIPWIRE -->
  <rect x="295" y="335" width="175" height="65" rx="8" fill="#b71c1c" stroke="#ef5350" stroke-width="1.5"/>
  <text x="382" y="360" text-anchor="middle" class="comp-label">Tripwire Check</text>
  <text x="382" y="377" text-anchor="middle" class="comp-sub">tripwire.py</text>
  <text x="382" y="392" text-anchor="middle" class="comp-sub">path + canary scan</text>

  <!-- HOOK ENGINE -->
  <rect x="520" y="335" width="195" height="65" rx="8" fill="#e65100" stroke="#ff9800" stroke-width="1.5"/>
  <text x="617" y="360" text-anchor="middle" class="comp-label">Hook / Policy Engine</text>
  <text x="617" y="377" text-anchor="middle" class="comp-sub">google_adapter.py</text>
  <text x="617" y="392" text-anchor="middle" class="comp-sub">Antigravity + Gemini CLI</text>

  <!-- TYPOSQUAT -->
  <rect x="765" y="335" width="145" height="65" rx="8" fill="#e65100" stroke="#ff9800" stroke-width="1"/>
  <text x="837" y="360" text-anchor="middle" class="comp-label">Typosquat</text>
  <text x="837" y="377" text-anchor="middle" class="comp-sub">typosquat.py</text>
  <text x="837" y="392" text-anchor="middle" class="comp-sub">Damerau-Levenshtein</text>

  <!-- QUARANTINE -->
  <rect x="295" y="440" width="175" height="60" rx="8" fill="#b71c1c" stroke="#ef5350" stroke-width="1.5"/>
  <text x="382" y="463" text-anchor="middle" class="comp-label">quarantine()</text>
  <text x="382" y="480" text-anchor="middle" class="comp-sub">Sign stop record</text>
  <text x="382" y="494" text-anchor="middle" class="comp-sub">Freeze agent</text>

  <!-- SIGNER -->
  <rect x="520" y="440" width="195" height="60" rx="8" fill="#0d47a1" stroke="#42a5f5" stroke-width="1.5"/>
  <text x="617" y="463" text-anchor="middle" class="comp-label">Ed25519 Signer</text>
  <text x="617" y="480" text-anchor="middle" class="comp-sub">signing.py + audit chain</text>
  <text x="617" y="494" text-anchor="middle" class="comp-sub">SHA-256 hash-linked</text>

  <!-- VOICE -->
  <rect x="295" y="545" width="175" height="65" rx="8" fill="#1b5e20" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="382" y="570" text-anchor="middle" class="comp-label">Gemini Live Voice</text>
  <text x="382" y="587" text-anchor="middle" class="comp-sub">voice.py</text>
  <text x="382" y="602" text-anchor="middle" class="comp-sub">EN / HI / TE</text>

  <!-- EGRESS PROXY -->
  <rect x="70" y="545" width="175" height="55" rx="8" fill="#e65100" stroke="#ff9800" stroke-width="1"/>
  <text x="157" y="568" text-anchor="middle" class="comp-label">Egress Proxy</text>
  <text x="157" y="585" text-anchor="middle" class="comp-sub">egress.py · HTTP only</text>

  <!-- CAPTURE SERVER -->
  <rect x="70" y="630" width="175" height="45" rx="8" fill="#bf360c" stroke="#ff7043" stroke-width="1"/>
  <text x="157" y="650" text-anchor="middle" class="comp-label">Capture Server</text>
  <text x="157" y="665" text-anchor="middle" class="comp-sub">attacker_server.py · /collect</text>

  <!-- ============ ARROWS ============ -->
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#58a6ff"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f85149"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3fb950"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#d29922"/></marker>
  </defs>

  <!-- Browser → Caddy -->
  <line x1="115" y1="113" x2="115" y2="230" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="6,3"/>
  <text x="125" y="175" class="flow-label">HTTP / WS</text>

  <!-- Browser Mic ↔ Voice (bidirectional) -->
  <line x1="255" y1="113" x2="255" y2="160" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="255" y1="160" x2="860" y2="160" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="860" y1="160" x2="860" y2="545" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="860" y1="545" x2="470" y2="545" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="590" y="153" class="flow-label">WebSocket PCM audio (bidirectional)</text>

  <!-- Caddy → Arena -->
  <line x1="140" y1="260" x2="140" y2="290" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Agent → Tripwire -->
  <line x1="245" y1="367" x2="295" y2="367" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="252" y="360" class="flow-label">every tool call</text>

  <!-- Tripwire → Hook (clean) -->
  <line x1="470" y1="367" x2="520" y2="367" stroke="#d29922" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="480" y="360" class="flow-label">clean</text>

  <!-- Hook → Typosquat -->
  <line x1="715" y1="367" x2="765" y2="367" stroke="#d29922" stroke-width="1.5" marker-end="url(#ao)"/>

  <!-- Tripwire → quarantine (TRIP!) -->
  <line x1="382" y1="400" x2="382" y2="440" stroke="#f85149" stroke-width="2" marker-end="url(#ar)"/>
  <text x="392" y="425" class="flow-label" fill="#f85149" font-weight="700">TRIP!</text>

  <!-- quarantine → Signer -->
  <line x1="470" y1="470" x2="520" y2="470" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="478" y="462" class="flow-label">sign</text>

  <!-- quarantine → Voice -->
  <line x1="382" y1="500" x2="382" y2="545" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="392" y="528" class="flow-label">freeze + call</text>

  <!-- Voice → Signer (record_decision) -->
  <line x1="470" y1="577" x2="520" y2="490" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="488" y="540" class="flow-label">sign decision</text>

  <!-- Agent → Proxy (run_command HTTP) -->
  <line x1="157" y1="400" x2="157" y2="545" stroke="#d29922" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="167" y="480" class="flow-label">run_command</text>
  <text x="167" y="494" class="flow-label">(HTTP_PROXY)</text>

  <!-- Proxy → Capture -->
  <line x1="157" y1="600" x2="157" y2="630" stroke="#d29922" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="167" y="620" class="flow-label">allow-list</text>

</svg>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#4a148c"></div> Gemini Flash Agent</div>
  <div class="legend-item"><div class="legend-dot" style="background:#b71c1c"></div> Tripwire (trip + quarantine)</div>
  <div class="legend-item"><div class="legend-dot" style="background:#0d47a1"></div> Ed25519 Signer + Audit Chain</div>
  <div class="legend-item"><div class="legend-dot" style="background:#1b5e20"></div> Gemini Live Voice Bridge</div>
  <div class="legend-item"><div class="legend-dot" style="background:#e65100"></div> Hook Engine / Egress / Typosquat</div>
  <div class="legend-item"><div class="legend-dot" style="background:#bf360c"></div> Fake Attacker Capture Server</div>
</div>

</body>
</html>
