# Trivy secret-scan config: narrowly scoped exceptions for reviewed fixtures.
allow-rules:
  - id: benchmark-fixture-stripe-test-key
    description: LLM-invented Stripe test-format key in benchmark fixtures, not a real key
    path: benchmarks/injection/(fresh_dev\.jsonl|results\.json)
    regex: sk_test_[A-Za-z0-9]{8,20}

  # -- Arena demo canary credentials (fake, intentional bait for the attacking agent) --
  - id: arena-duel-fake-stripe
    description: "Fake demo canary: FAKE_ENV Stripe key in arena/duel.py (explicitly labelled fake)"
    path: arena/duel\.py
    regex: sk_live_51DEMOfakeKEY0+

  - id: arena-recording-fix-deploy-stripe
    description: "Fake demo canary: Stripe key in arena/recordings/fix-deploy.json (canary_hit recording)"
    path: arena/recordings/fix-deploy\.json
    regex: sk_live_[A-Za-z0-9]{20,30}

  - id: arena-recording-setup-stripe
    description: "Fake demo canary: Stripe key in arena/recordings/setup.json (canary_hit recording)"
    path: arena/recordings/setup\.json
    regex: sk_live_[A-Za-z0-9]{20,30}
