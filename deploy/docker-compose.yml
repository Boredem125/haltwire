# Tripwire -- single-VM deployment stack
#
# Usage:
#   cp .env.example .env   # fill in keys
#   docker compose up -d --build
#   docker compose logs -f arena
#
# Build context is the repo root (one level up).

services:
  # --------------------------------------------------------------------------
  # arena: FastAPI server (uid 999, non-root)
  # --------------------------------------------------------------------------
  arena:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: tripwire-arena
    user: "999:999"
    group_add:
      - "10001"
    environment:
      - ARENA_AGENT_KEY=${ARENA_AGENT_KEY:?set ARENA_AGENT_KEY in .env}
      - ARENA_AGENT_KEY1=${ARENA_AGENT_KEY1:-}
      - ARENA_ATTACKER_KEY=${ARENA_ATTACKER_KEY:?set ARENA_ATTACKER_KEY in .env}
      - ARENA_ADMIN_TOKEN=${ARENA_ADMIN_TOKEN:?set ARENA_ADMIN_TOKEN in .env}
      # Bind API only on the arena-net address so runner cannot reach it
      - ARENA_HOST=172.30.0.10
      - ARENA_PORT=8088
      - ARENA_PROXY_BIND=172.31.0.10
      - ARENA_RUNS=/runs
      - ARENA_PUBLIC=1
      - ARENA_RUNNER_SOCK=/sock/exec.sock
      - SANDBOX_KEY_HOME=/data/keys
      - ARENA_PHONE=${ARENA_PHONE:-0}
      # Phone decision calls: key only in the arena container, never the runner
      - BOLNA_API_KEY=${BOLNA_API_KEY:-}
      # Auto-call on freeze: numbers only in deploy/.env (gitignored), never in the page
      - ARENA_AUTOCALL_NUMBER=${ARENA_AUTOCALL_NUMBER:-}
      - PHONE_PER_NUMBER_CAP=${PHONE_PER_NUMBER_CAP:-2}
      - ARENA_PUBLIC_URL=${ARENA_PUBLIC_URL:-}
      - ARENA_TRUSTED_PROXY=172.30.0.2
      # L6 Host allow-list: the public domain Caddy serves (localhost always allowed)
      - ARENA_PUBLIC_HOST=${ARENA_DOMAIN:-}
    # The server binds 172.30.0.10 and checks the Host header (L6).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://172.30.0.10:8088/api/variants', headers={'Host': 'localhost'}), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      arena-net:
        ipv4_address: 172.30.0.10
      runner-net:
        ipv4_address: 172.31.0.10
    restart: unless-stopped
    depends_on:
      - runner
    volumes:
      - runs:/runs
      - sock:/sock
      - keys:/data/keys

    # --- hardening ---
    read_only: true
    tmpfs:
      - /tmp:size=256M
      - /home/arena:size=64M,uid=999,gid=999
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # --- resource limits ---
    mem_limit: 2g
    cpus: "1.5"
    pids_limit: 256

  # --------------------------------------------------------------------------
  # runner: privileged command executor (root -> drops to uid 10001)
  #
  # Capabilities justified:
  #   SETUID  -- setuid() to drop from root to uid 10001 for each command
  #   SETGID  -- setgid() to drop to gid 10001
  #   KILL    -- os.killpg(SIGKILL) on timed-out agent process groups
  #   CHOWN   -- chown socket file to root:999 so arena (uid 999) can connect
  #   FOWNER  -- set socket permissions (chmod 0660) regardless of ownership
  # --------------------------------------------------------------------------
  runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: tripwire-runner
    command: ["python", "-m", "arena.runner_daemon"]
    healthcheck:
      test: ["CMD", "test", "-S", "/sock/exec.sock"]
      interval: 15s
      timeout: 3s
      retries: 3
    user: "root"
    # Popen chdirs into the workspace before dropping to uid 10001.  Root here
    # has no DAC capabilities, so it needs the agentrun group (10001) to reach
    # /runs (2750 arena:agentrun) and the 2770 workspaces.
    group_add:
      - "10001"
    environment:
      - ARENA_RUNNER_SOCK=/sock/exec.sock
      - ARENA_RUNS=/runs
      # No secret env vars here -- runner never needs API keys
    networks:
      runner-net:
        ipv4_address: 172.31.0.20
    restart: unless-stopped
    volumes:
      - runs:/runs
      - sock:/sock

    # --- hardening ---
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
      - CHOWN
      - FOWNER
    dns:
      - "127.0.0.1"

    # --- resource limits ---
    mem_limit: 1g
    cpus: "1"
    pids_limit: 128

  # --------------------------------------------------------------------------
  # caddy: reverse proxy with automatic HTTPS
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: tripwire-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      - ARENA_DOMAIN=${ARENA_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      arena-net:
        ipv4_address: 172.30.0.2
    restart: unless-stopped
    depends_on:
      - arena

networks:
  arena-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  runner-net:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  caddy-data:
  caddy-config:
  runs:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=512m,uid=999,gid=10001,mode=2750"  # root not writable by the agent; workspaces are 2770
  sock:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m"
  keys:
